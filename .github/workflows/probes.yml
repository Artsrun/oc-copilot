# Real OpenCode, nightly and on demand: each version in its own job (its own
# runner, its own prefix, nothing on PATH), the bridge's out/ driven against it
# with the scripted model (scripts/probe-model.js: no provider, no cost).
# Pinned cells must pass; `latest` is the early warning and may fail.
name: probes
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: opencode 1.19.0 (pinned)
            package: opencode-ai@1.19.0
            probe: scripts/probe-readonly.js
            optional: false
          - cell: opencode 1.19.5 (pinned)
            package: opencode-ai@1.19.5
            probe: scripts/probe-readonly.js
            optional: false
          - cell: opencode 2.0.29 (pinned)
            package: "@opencode/cli@2.0.29"
            probe: scripts/probe-opencode2.js
            optional: false
          - cell: opencode 2.2.5 (pinned)
            package: "@opencode/cli@2.2.5"
            probe: scripts/probe-opencode2.js
            optional: false
          - cell: opencode 2.2.5 (pinned) · read-only over ACP
            package: "@opencode/cli@2.2.5"
            probe: scripts/probe-readonly.js
            optional: false
          - cell: opencode 2 latest
            package: "@opencode/cli@latest"
            probe: scripts/probe-opencode2.js
            optional: true
    name: ${{ matrix.cell }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run compile
      - name: Install ${{ matrix.package }} into its own prefix
        run: npm i --no-audit --no-fund --prefix "$RUNNER_TEMP/oc" "${{ matrix.package }}"
      - name: Version
        run: '"$RUNNER_TEMP/oc/node_modules/.bin/opencode" --version'
      - name: Probe
        run: node ${{ matrix.probe }} "$RUNNER_TEMP/oc/node_modules/.bin/opencode"
  # What a real 2.x does to a folder a real 1.x uses: two binaries, one data folder.
  data-folder:
    strategy:
      fail-fast: false
      matrix:
        two: ["2.0.29", "2.2.5"]
    name: data folder · 1.19.5 then ${{ matrix.two }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run compile
      - name: Install both into their own prefixes
        run: |
          npm i --no-audit --no-fund --prefix "$RUNNER_TEMP/oc2" "@opencode/cli@${{ matrix.two }}"
          npm i --no-audit --no-fund --prefix "$RUNNER_TEMP/oc1" opencode-ai@1.19.5
      - name: Probe
        run: node scripts/probe-data-folder.js "$RUNNER_TEMP/oc2/node_modules/.bin/opencode" "$RUNNER_TEMP/oc1/node_modules/.bin/opencode"
