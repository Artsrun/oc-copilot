# The gate on every push and pull request: typecheck, build, the suite (fake
# OpenCode binaries, real recorded wire bytes) and the package checks, on the
# three operating systems the extension runs on. No OpenCode is installed here.
name: ship
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # The repo is LF (`* text=auto`); a Windows runner would check it out CRLF,
      # and the suite and gate read README and docs as text.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ship
